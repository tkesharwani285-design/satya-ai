<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satya.ai – Verify Anything. Trust the truth.</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:#0b0f19;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e2e8f0}
.glow-text{background:linear-gradient(90deg,#22d3ee,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(34,211,238,.35))}
.glass{backdrop-filter:blur(12px);background:rgba(15,23,42,.6);border:1px solid rgb(30,41,59)}
.pulse-dot{animation:p 1.8s infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
.rise{animation:r .35s ease-out}@keyframes r{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.pop{animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
.flow-line{background:linear-gradient(90deg,#22d3ee,#818cf8,#22d3ee);background-size:200% 100%;animation:f 4s linear infinite}@keyframes f{to{background-position:200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const PATHS = {
  wave: "M2 12h3l3-8 4 16 3-12 2 4h5",
  link: "M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1",
  text: "M4 6h16M4 12h16M4 18h10",
  image: "M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6M8.5 9.5h.01",
  mic: "M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 11a7 7 0 0 1-14 0M12 18v4",
  clock: "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 6v6l4 2",
  lang: "M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2zM12 7v4M12 14h.01",
  bot: "M12 8V4H8M4 8h16v12H4zM2 14h2M20 14h2M9 13v2M15 13v2",
  shield: "M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5zM9 12l2 2 4-4",
  alert: "M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5zM12 8v4M12 16h.01",
  check: "M20 6L9 17l-5-5",
  arrow: "M5 12h14M13 6l6 6-6 6",
  ext: "M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6",
  upload: "M12 16V4M6 10l6-6 6 6M4 20h16",
  chat: "M21 11.5a8.4 8.4 0 0 1-12.5 7.3L3 21l2-5.5A8.5 8.5 0 1 1 21 11.5z",
  puzzle: "M4 8h4a2 2 0 1 1 4 0h4v4a2 2 0 1 1 0 4v4H4z",
  server: "M3 4h18v6H3zM3 14h18v6H3zM7 7h.01M7 17h.01",
  user: "M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
  x: "M18 6L6 18M6 6l12 12",
  lock: "M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4",
  mail: "M3 5h18v14H3zM3 7l9 6 9-6",
  logout: "M9 21H5V3h4M16 17l5-5-5-5M21 12H9",
  github: "M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.28 1.15-.28 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65S8.93 17.38 9 18v4M9 18c-4.51 2-5-2-7-2",
};
const Icon = ({ n, s = 18, c = "" }) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c} aria-hidden="true"><path d={PATHS[n]} /></svg>
);

const TONE = {
  high: { label: "High Risk", chip: "bg-rose-500/15 text-rose-300 border-rose-500/40", text: "text-rose-400", bar: "bg-rose-500", glow: "shadow-[0_0_40px_-8px_rgba(244,63,94,.55)]" },
  caution: { label: "Caution", chip: "bg-amber-500/15 text-amber-300 border-amber-500/40", text: "text-amber-400", bar: "bg-amber-500", glow: "shadow-[0_0_40px_-8px_rgba(245,158,11,.5)]" },
  verified: { label: "Verified", chip: "bg-emerald-500/15 text-emerald-300 border-emerald-500/40", text: "text-emerald-400", bar: "bg-emerald-500", glow: "shadow-[0_0_40px_-8px_rgba(16,185,129,.5)]" },
};

const SCENARIOS = [
  { id: "flood", tone: "high", chip: "Recycled 2018 Flood Photo", mode: "image", input: "viral_flood_photo.jpg",
    score: 88, verdictText: "High Misinformation Risk",
    summary: "This image circulating as 'floods in the city this week' first appeared online in August 2018 and shows a different region. Its caption uses alarmist language and is being pushed by a coordinated cluster of new accounts.",
    temporal: { claimed: "This week", original: "14 Aug 2018", gap: "8 years 2 months", note: "Earliest indexed upload found on a regional news archive; EXIF metadata stripped.", hits: [["Regional daily archive", "14 Aug 2018", "Original caption: coastal district flooding"], ["Photo-sharing site", "15 Aug 2018", "Same frame, higher resolution"], ["Social repost (viral)", "This week", "Caption altered to claim current event"]] },
    ling: { sens: 91, emo: 84, lines: [["BREAKING!!! City is DROWNING, officials are HIDING the truth", 95], ["Share before it gets deleted — thousands trapped", 88], ["Photo taken by a resident near the old market", 40], ["Water levels rose within hours", 22]], flags: ["Urgency trigger", "Conspiracy framing", "Unverifiable eyewitness"] },
    bot: { pct: 73, accounts: 412, age: "81% under 30 days old", note: "Posting bursts every 4–6 minutes with near-identical captions and hashtag sets.", series: [8, 12, 20, 55, 90, 74, 60, 38, 24, 14] },
    audio: { na: true },
    checks: [["Reuters Fact Check", "False", "Image predates the claimed event by years.", "high"], ["AP News Verify", "Misleading", "Photo reused from a 2018 flood; location mismatch.", "high"], ["Google Fact Check index", "3 matching reviews", "Rated False by independent reviewers.", "high"]] },
  { id: "bank", tone: "verified", chip: "Central Bank Policy", mode: "text", input: "Central bank holds the repo rate steady at its latest monetary policy meeting, citing easing inflation.",
    score: 6, verdictText: "Verified – Low Risk",
    summary: "The claim matches the official policy statement and is reported consistently by multiple independent outlets. Language is neutral and no coordinated amplification was detected.",
    temporal: { claimed: "Today", original: "Today", gap: "No mismatch", note: "Primary source published the same day; timeline is consistent.", hits: [["Official policy statement", "Today", "Primary source"], ["Wire report", "Today", "Same figures, attributed"], ["Business daily", "Today", "Analysis with quotes"]] },
    ling: { sens: 8, emo: 5, lines: [["Central bank keeps repo rate unchanged", 6], ["Governor cites easing inflation and stable growth", 10], ["Markets reacted calmly to the announcement", 12]], flags: ["Neutral tone", "Attributed sources"] },
    bot: { pct: 4, accounts: 9, age: "Organic account mix", note: "Spread follows normal news-cycle patterns with no synthetic bursts.", series: [30, 44, 40, 34, 28, 22, 18, 14, 10, 8] },
    audio: { na: true },
    checks: [["Reuters", "Confirmed", "Matches reported decision and rationale.", "verified"], ["AP News", "Confirmed", "Consistent with the official statement.", "verified"], ["Google Fact Check index", "No disputes", "No fact-checks flag this claim.", "verified"]] },
  { id: "voice", tone: "caution", chip: "Cloned Leader Voice Note", mode: "audio", input: "forwarded_voice_note.ogg",
    score: 64, verdictText: "Caution – Likely Synthetic Audio",
    summary: "The voice note shows spectral artifacts typical of text-to-speech cloning and an unnaturally even pitch. No credible outlet has reported the statement attributed to the speaker.",
    temporal: { claimed: "Yesterday", original: "First seen yesterday", gap: "No earlier source", note: "No original broadcast or recording found for this statement.", hits: [["Messaging forward chain", "Yesterday", "Earliest known share"], ["Public speech archive", "—", "No matching speech"]] },
    ling: { sens: 58, emo: 71, lines: [["I am telling you all to stop what you are doing now", 74], ["The government will not tell you this", 80], ["Please forward to everyone you know", 66]], flags: ["Chain-forward request", "Appeal to secrecy"] },
    bot: { pct: 38, accounts: 126, age: "44% under 90 days old", note: "Moderate automated forwarding across group chats.", series: [4, 10, 22, 36, 40, 33, 25, 18, 12, 9] },
    audio: { synth: 79, cloneProb: "High", notes: ["Missing breath sounds between phrases", "Flat micro-pitch variation (±0.4 Hz)", "Spectral cutoff above 8 kHz typical of neural TTS", "Background noise loop repeats every 3.2 s"], bars: [20, 34, 48, 62, 70, 64, 58, 72, 80, 76, 60, 44, 30, 22] },
    checks: [["Reuters Fact Check", "No record", "No reporting on the claimed statement.", "caution"], ["AP News Verify", "Under review", "Audio authenticity flagged for review.", "caution"], ["Google Fact Check index", "1 related review", "Similar cloned-audio forwards rated Misleading.", "caution"]] },
];

const FEATURES = [
  { id: "temporal", icon: "clock", title: "Temporal Audit", desc: "Reverse-image search and original upload date" },
  { id: "ling", icon: "lang", title: "Linguistic Analysis", desc: "Sensationalism and emotional heatmap" },
  { id: "bot", icon: "bot", title: "Bot Swarm Risk", desc: "Synthetic amplification and automated accounts" },
  { id: "audio", icon: "wave", title: "Audio Analyzer", desc: "TTS and voice-clone spectrogram check" },
];
const TABS = [["url", "Article URL", "link"], ["text", "Text / Claim / WhatsApp", "text"], ["image", "Image / Media", "image"], ["audio", "Audio / Voice Note", "mic"]];
const LINKS = [["Home", "home"], ["Features Flow", "flow"], ["WhatsApp Bot", "whatsapp"], ["Extension", "extension"], ["API Status", "api"]];

function Header({ user, onAuth, onSignOut }) {
  const [ms, setMs] = useState(98);
  useEffect(() => { const t = setInterval(() => setMs(90 + Math.floor(Math.random() * 18)), 2500); return () => clearInterval(t); }, []);
  return (
    <header className="sticky top-0 z-30 glass border-x-0 border-t-0">
      <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
        <a href="#home" className="flex items-center gap-2 font-semibold text-lg text-white">
          <span className="relative grid place-items-center w-9 h-9 rounded-xl bg-cyan-400/10 border border-cyan-400/40 text-cyan-300 shadow-[0_0_20px_rgba(34,211,238,.35)]">
            <Icon n="wave" c="pulse-dot" />
          </span>Satya<span className="text-cyan-300">.ai</span>
        </a>
        <nav className="hidden lg:flex items-center gap-1 text-sm text-slate-300">
          {LINKS.map(([l, id]) => <a key={id} href={"#" + id} className="px-3 py-2 rounded-lg hover:bg-slate-800/80 hover:text-white transition-colors">{l}</a>)}
        </nav>
        <div className="flex items-center gap-2 sm:gap-3"><div className="hidden sm:flex items-center gap-2 text-xs px-3 py-1.5 rounded-full border border-emerald-500/40 bg-emerald-500/10 text-emerald-300 whitespace-nowrap">
          <span className="w-2 h-2 rounded-full bg-emerald-400 pulse-dot" />
          <span>Satya Core: Active</span><span className="hidden sm:inline text-slate-500">|</span><span className="hidden sm:inline">Latency: {ms}ms</span>
        </div>
        {user ? (
          <div className="flex items-center gap-2">
            <span className="hidden md:inline-flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-full border border-indigo-400/40 bg-indigo-500/15 text-indigo-200 whitespace-nowrap"><Icon n="shield" s={14} />Logged In (Pro Tier)</span>
            <span title={user.email} className="grid place-items-center w-9 h-9 rounded-full bg-gradient-to-br from-cyan-400 to-indigo-500 text-slate-950 font-bold shadow-[0_0_16px_rgba(34,211,238,.4)]">{user.name[0].toUpperCase()}</span>
            <button onClick={onSignOut} aria-label="Sign out" title="Sign out" className="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800"><Icon n="logout" s={16} /></button>
          </div>
        ) : (
          <button onClick={onAuth} className="px-4 py-2 rounded-lg text-sm font-medium text-cyan-200 border border-cyan-400/40 bg-cyan-400/10 hover:bg-cyan-400/20 transition-colors whitespace-nowrap">Sign In / Register</button>
        )}
        </div>
      </div>
    </header>
  );
}

function Hero({ onVerify, loading, activeId, onDemo }) {
  const [tab, setTab] = useState("url");
  const [vals, setVals] = useState({ url: "", text: "", image: "", audio: "" });
  const [file, setFile] = useState({});
  const set = (v) => setVals({ ...vals, [tab]: v });
  const cta = { url: "Verify URL", text: "Verify Claim", image: "Verify Image", audio: "Verify Audio" }[tab];
  const ready = tab === "url" || tab === "text" ? vals[tab].trim().length > 3 : !!file[tab];
  const submit = (e) => { e.preventDefault(); if (!ready || loading) return; onVerify(tab, vals[tab] || file[tab]); };
  const pick = (e) => { const f = e.target.files[0]; if (f) setFile({ ...file, [tab]: f.name }); };
  return (
    <section id="home" className="relative pt-14 pb-10 px-4 text-center">
      <div className="absolute inset-x-0 top-0 h-[480px] -z-10 bg-[radial-gradient(ellipse_at_top,rgba(99,102,241,.22),transparent_60%)]" />
      <h1 className="text-4xl sm:text-6xl font-extrabold tracking-tight text-white leading-[1.05]">Verify Anything.<br /><span className="glow-text">Trust the truth.</span></h1>
      <p className="mt-5 max-w-2xl mx-auto text-slate-400 text-base sm:text-lg">Multimodal fact-checking for articles, claims, images and voice notes — with explainable AI.</p>
      <form onSubmit={submit} className="glass rounded-2xl mt-9 max-w-3xl mx-auto p-3 sm:p-4 text-left shadow-[0_0_60px_-20px_rgba(129,140,248,.5)]">
        <div role="tablist" className="flex gap-1 overflow-x-auto pb-3">
          {TABS.map(([id, label, ic]) => (
            <button type="button" role="tab" aria-selected={tab === id} key={id} onClick={() => setTab(id)}
              className={"flex items-center gap-2 px-3 py-2 rounded-lg text-sm whitespace-nowrap transition-colors " + (tab === id ? "bg-indigo-500/20 text-cyan-300 border border-indigo-400/40" : "text-slate-400 border border-transparent hover:text-white hover:bg-slate-800/70")}>
              <Icon n={ic} s={16} />{label}
            </button>))}
        </div>
        <div className="flex flex-col sm:flex-row gap-3">
          {tab === "url" && <input value={vals.url} onChange={(e) => set(e.target.value)} placeholder="https://example.com/news/article" className="flex-1 min-w-0 bg-slate-950/70 border border-slate-800 focus:border-cyan-400/60 outline-none rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500" />}
          {tab === "text" && <textarea value={vals.text} onChange={(e) => set(e.target.value)} rows={3} placeholder="Paste a claim, headline or forwarded WhatsApp message…" className="flex-1 min-w-0 bg-slate-950/70 border border-slate-800 focus:border-cyan-400/60 outline-none rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 resize-none" />}
          {(tab === "image" || tab === "audio") && (
            <label className="flex-1 min-w-0 flex items-center justify-center gap-3 cursor-pointer bg-slate-950/70 border border-dashed border-slate-700 hover:border-cyan-400/60 rounded-xl px-4 py-5 text-slate-400">
              <Icon n="upload" />
              <span className="truncate">{file[tab] || (tab === "image" ? "Drop an image or video frame, or click to browse" : "Drop a voice note, or click to browse")}</span>
              <input type="file" className="sr-only" accept={tab === "image" ? "image/*,video/*" : "audio/*"} onChange={pick} />
            </label>)}
          <button type="submit" disabled={!ready || loading}
            className="sm:self-stretch px-6 py-3 rounded-xl font-semibold text-slate-950 bg-cyan-400 hover:bg-cyan-300 disabled:opacity-40 disabled:cursor-not-allowed shadow-[0_0_28px_rgba(34,211,238,.55)] transition-all flex items-center justify-center gap-2">
            {loading ? "Analyzing…" : cta}{!loading && <Icon n="arrow" s={16} />}
          </button>
        </div>
      </form>
      <div className="mt-5 flex flex-wrap items-center justify-center gap-2 max-w-3xl mx-auto">
        <span className="text-xs text-slate-500 mr-1">Try a demo:</span>
        {SCENARIOS.map((s) => (
          <button key={s.id} onClick={() => onDemo(s.id)} disabled={loading}
            className={"text-xs sm:text-sm px-3 py-1.5 rounded-full border flex items-center gap-2 transition-all hover:scale-[1.03] " + TONE[s.tone].chip + (activeId === s.id ? " ring-2 ring-white/20" : "")}>
            <b>[{TONE[s.tone].label}]</b>{s.chip}
          </button>))}
      </div>
    </section>
  );
}

function Flow({ onPick, active }) {
  return (
    <section id="flow" className="px-4 py-14 max-w-6xl mx-auto">
      <h2 className="text-center text-2xl sm:text-3xl font-bold text-white">How Satya works</h2>
      <p className="text-center text-slate-400 mt-2">Every verification runs through four independent checks. Select one to open its analysis.</p>
      <div className="relative mt-10">
        <div className="hidden lg:block absolute top-[46px] left-[12%] right-[12%] h-[2px] rounded flow-line opacity-70" />
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-5 relative">
          {FEATURES.map((f, i) => (
            <button key={f.id} onClick={() => onPick(f.id)}
              className={"glass rounded-2xl p-5 text-left transition-all hover:-translate-y-1 hover:border-cyan-400/50 hover:shadow-[0_0_30px_-8px_rgba(34,211,238,.5)] " + (active === f.id ? "border-cyan-400/60" : "")}>
              <span className="grid place-items-center w-12 h-12 rounded-xl bg-indigo-500/15 border border-indigo-400/40 text-cyan-300 mb-4 bg-[#0b0f19] relative"><Icon n={f.icon} s={22} /></span>
              <div className="text-xs text-slate-500">Step {i + 1}</div>
              <h3 className="font-semibold text-white mt-0.5">{f.title}</h3>
              <p className="text-sm text-slate-400 mt-1">{f.desc}</p>
              <span className="mt-3 inline-flex items-center gap-1 text-sm text-cyan-300">Open analysis <Icon n="arrow" s={14} /></span>
            </button>))}
        </div>
      </div>
    </section>
  );
}

function Loading() {
  const steps = ["Fetching content", "Running temporal audit", "Scoring language", "Scanning amplification", "Cross-referencing fact-checkers"];
  const [i, setI] = useState(0);
  useEffect(() => { const t = setInterval(() => setI((x) => Math.min(x + 1, steps.length - 1)), 300); return () => clearInterval(t); }, []);
  return (
    <div className="glass rounded-2xl p-10 text-center rise">
      <div className="mx-auto w-12 h-12 rounded-full border-2 border-slate-700 border-t-cyan-400 animate-spin" />
      <p className="mt-5 text-white font-semibold">Analyzing Satya Engine…</p><p className="text-sm text-slate-400 mt-1">{steps[i]}</p>
      <div className="mt-4 h-1.5 max-w-xs mx-auto rounded bg-slate-800 overflow-hidden"><div className="h-full flow-line transition-all duration-300" style={{ width: ((i + 1) / steps.length) * 100 + "%" }} /></div>
    </div>
  );
}

const Stat = ({ label, value, sub, tone = "text-white" }) => (
  <div className="rounded-xl bg-slate-950/60 border border-slate-800 p-4"><div className="text-xs text-slate-500">{label}</div><div className={"text-xl font-bold mt-1 " + tone}>{value}</div>{sub && <div className="text-xs text-slate-500 mt-1">{sub}</div>}</div>
);
const heat = (v) => v > 70 ? "bg-rose-500/25 border-rose-500/50" : v > 40 ? "bg-amber-500/20 border-amber-500/40" : "bg-emerald-500/10 border-emerald-500/30";

function Panel({ r, tab }) {
  const t = TONE[r.tone];
  if (tab === "temporal") return (
    <div className="rise space-y-4">
      <div className="grid sm:grid-cols-3 gap-3">
        <Stat label="Claimed date" value={r.temporal.claimed} />
        <Stat label="Original upload" value={r.temporal.original} tone={t.text} />
        <Stat label="Time gap" value={r.temporal.gap} sub={r.temporal.note} />
      </div>
      <div className="space-y-2">
        <h4 className="text-sm text-slate-400">Reverse-search timeline</h4>
        {r.temporal.hits.map(([src, date, note], i) => (
          <div key={i} className="flex items-start gap-3 rounded-xl bg-slate-950/60 border border-slate-800 p-3">
            <span className="mt-1 w-2.5 h-2.5 rounded-full bg-cyan-400 shrink-0 shadow-[0_0_10px_#22d3ee]" />
            <div className="flex-1 min-w-0"><div className="text-slate-100 text-sm font-medium">{src}</div><div className="text-xs text-slate-500">{note}</div></div>
            <span className="text-xs text-slate-300 whitespace-nowrap">{date}</span>
          </div>))}
      </div>
    </div>);
  if (tab === "ling") return (
    <div className="rise space-y-4">
      <div className="grid sm:grid-cols-2 gap-3">
        {[["Sensationalism", r.ling.sens], ["Emotional manipulation", r.ling.emo]].map(([l, v]) => (
          <div key={l} className="rounded-xl bg-slate-950/60 border border-slate-800 p-4">
            <div className="flex justify-between text-sm"><span className="text-slate-300">{l}</span><span className="text-white font-semibold">{v}/100</span></div>
            <div className="h-2 rounded bg-slate-800 mt-2 overflow-hidden"><div className={"h-full rounded " + (v > 70 ? "bg-rose-500" : v > 40 ? "bg-amber-500" : "bg-emerald-500")} style={{ width: v + "%" }} /></div>
          </div>))}
      </div>
      <h4 className="text-sm text-slate-400">Emotional heatmap</h4>
      <div className="space-y-2">{r.ling.lines.map(([s, v], i) => <div key={i} className={"rounded-lg border px-3 py-2 text-sm text-slate-100 flex justify-between gap-3 " + heat(v)}><span>{s}</span><span className="text-xs text-slate-400 shrink-0">{v}</span></div>)}</div>
      <div className="flex flex-wrap gap-2">{r.ling.flags.map((f) => <span key={f} className="text-xs px-2.5 py-1 rounded-full bg-indigo-500/15 border border-indigo-400/30 text-indigo-200">{f}</span>)}</div>
    </div>);
  if (tab === "bot") return (
    <div className="rise space-y-4">
      <div className="grid sm:grid-cols-3 gap-3">
        <Stat label="Synthetic amplification" value={r.bot.pct + "%"} tone={r.bot.pct > 60 ? "text-rose-400" : r.bot.pct > 30 ? "text-amber-400" : "text-emerald-400"} />
        <Stat label="Suspect accounts" value={r.bot.accounts} />
        <Stat label="Account age" value={r.bot.age} />
      </div>
      <div className="rounded-xl bg-slate-950/60 border border-slate-800 p-4">
        <div className="text-sm text-slate-400 mb-3">Shares per hour</div>
        <div className="flex items-end gap-2 h-28">{r.bot.series.map((v, i) => <div key={i} className="flex-1 rounded-t bg-gradient-to-t from-indigo-500 to-cyan-400" style={{ height: Math.max(v, 4) + "%" }} />)}</div>
        <p className="text-sm text-slate-400 mt-3">{r.bot.note}</p>
      </div>
    </div>);
  if (tab === "audio") return r.audio.na ? (
    <div className="rise text-center py-10 text-slate-400"><Icon n="mic" s={28} c="mx-auto mb-3 text-slate-600" />No audio attached to this item. Try the <b className="text-cyan-300">Cloned Leader Voice Note</b> demo to see the analyzer.</div>
  ) : (
    <div className="rise space-y-4">
      <div className="grid sm:grid-cols-2 gap-3"><Stat label="Synthetic speech score" value={r.audio.synth + "%"} tone="text-amber-400" /><Stat label="Voice-clone probability" value={r.audio.cloneProb} tone="text-amber-400" /></div>
      <div className="rounded-xl bg-slate-950/60 border border-slate-800 p-4">
        <div className="text-sm text-slate-400 mb-3">Spectrogram (energy by band)</div>
        <div className="grid grid-cols-14 gap-1" style={{ gridTemplateColumns: "repeat(14,1fr)" }}>
          {Array.from({ length: 6 }).map((_, row) => r.audio.bars.map((b, c) => { const lvl = b - row * 14; return <div key={row + "-" + c} className="h-4 rounded-sm" style={{ background: `rgba(${lvl > 40 ? "34,211,238" : "129,140,248"},${Math.max(0.08, Math.min(1, lvl / 80))})` }} />; }))}
        </div>
      </div>
      <ul className="space-y-2">{r.audio.notes.map((n) => <li key={n} className="flex gap-2 text-sm text-slate-300"><Icon n="alert" s={16} c="text-amber-400 mt-0.5 shrink-0" />{n}</li>)}</ul>
    </div>);
  return (
    <div className="rise space-y-3">
      {r.checks.map(([src, verdict, note, tone]) => (
        <div key={src} className="flex items-start gap-3 rounded-xl bg-slate-950/60 border border-slate-800 p-4">
          <Icon n="ext" c="text-slate-500 mt-1 shrink-0" />
          <div className="flex-1 min-w-0"><div className="text-slate-100 font-medium">{src}</div><div className="text-sm text-slate-400">{note}</div></div>
          <span className={"text-xs px-2.5 py-1 rounded-full border whitespace-nowrap " + TONE[tone].chip}>{verdict}</span>
        </div>))}
    </div>);
}

function Results({ r, tab, setTab, human }) {
  const t = TONE[r.tone];
  const RT = [["temporal", "Temporal Audit", "clock"], ["ling", "Linguistic", "lang"], ["bot", "Bot Swarm", "bot"], ["audio", "Audio", "wave"], ["checks", "Fact-Check Sources", "shield"]];
  return (
    <div id="results" className="rise space-y-5">
      <div className={"glass rounded-2xl p-5 sm:p-6 flex flex-col sm:flex-row gap-5 items-start " + t.glow}>
        <div className="flex sm:flex-col items-center gap-3 sm:w-44 shrink-0">
          <div className={"text-5xl font-extrabold " + t.text}>{r.score}%</div>
          <div className="sm:text-center"><span className={"inline-flex items-center gap-1.5 text-xs px-3 py-1 rounded-full border font-semibold " + t.chip}><Icon n={r.tone === "verified" ? "shield" : "alert"} s={14} />{r.verdictText}</span><div className="text-xs text-slate-500 mt-1.5">Satya trust score: {100 - r.score}/100</div></div>
        </div>
        <div className="flex-1 min-w-0">
          <div className="flex flex-wrap items-center gap-2 text-xs text-slate-500 mb-1.5"><span>Analyzed: <span className="text-slate-300 break-all">{r.input}</span></span>{human && <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full border border-emerald-500/40 bg-emerald-500/10 text-emerald-300"><Icon n="check" s={12} />Human Verified</span>}</div>
          <h3 className="text-white font-semibold text-lg">Executive summary</h3>
          <p className="text-slate-300 mt-1.5 leading-relaxed">{r.summary}</p>
          <div className="h-1.5 rounded bg-slate-800 mt-4 overflow-hidden"><div className={"h-full " + t.bar} style={{ width: r.score + "%" }} /></div>
        </div>
      </div>
      <div className="glass rounded-2xl p-4 sm:p-6">
        <div role="tablist" className="flex gap-1 overflow-x-auto pb-4 mb-4 border-b border-slate-800">
          {RT.map(([id, l, ic]) => <button key={id} role="tab" aria-selected={tab === id} onClick={() => setTab(id)} className={"flex items-center gap-2 px-3 py-2 rounded-lg text-sm whitespace-nowrap transition-colors " + (tab === id ? "bg-indigo-500/20 text-cyan-300 border border-indigo-400/40" : "text-slate-400 border border-transparent hover:text-white")}><Icon n={ic} s={16} />{l}</button>)}
        </div>
        <Panel r={r} tab={tab} />
      </div>
      <p className="text-center text-xs text-slate-600">Demo build: all analysis shown is simulated sample data.</p>
    </div>
  );
}

function Extras() {
  const items = [
    ["whatsapp", "chat", "WhatsApp Bot", "Forward any suspicious message to the Satya number and get a verdict, reasons and sources back in seconds."],
    ["extension", "puzzle", "Browser Extension", "Highlight text or right-click an image on any page for an inline trust badge, without leaving the article."],
    ["api", "server", "API Status", null],
  ];
  return (
    <section className="px-4 pb-16 max-w-6xl mx-auto grid md:grid-cols-3 gap-5">
      {items.map(([id, ic, t, d]) => (
        <div id={id} key={id} className="glass rounded-2xl p-5">
          <span className="grid place-items-center w-10 h-10 rounded-xl bg-cyan-400/10 border border-cyan-400/30 text-cyan-300 mb-3"><Icon n={ic} /></span>
          <h3 className="text-white font-semibold">{t}</h3>
          {d ? <p className="text-sm text-slate-400 mt-1">{d}</p> : (
            <ul className="mt-2 space-y-1.5 text-sm">{[["Verification API", "99.98% uptime"], ["Image forensics", "Operational"], ["Audio analyzer", "Operational"]].map(([a, b]) => <li key={a} className="flex justify-between text-slate-400"><span>{a}</span><span className="text-emerald-400 flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-emerald-400" />{b}</span></li>)}</ul>)}
        </div>))}
    </section>
  );
}

function Modal({ title, onClose, children }) {
  useEffect(() => { const k = (e) => e.key === "Escape" && onClose(); window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);
  return (
    <div className="fixed inset-0 z-50 grid place-items-center p-4 bg-black/60 backdrop-blur-sm rise" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div role="dialog" aria-modal="true" aria-label={title} className="pop w-full max-w-md max-h-[92vh] overflow-y-auto rounded-2xl bg-slate-900/80 backdrop-blur-xl border border-slate-800 p-6 shadow-[0_0_70px_-15px_rgba(129,140,248,.55)]">
        <div className="flex items-start justify-between gap-3 mb-5">
          <h2 className="text-lg font-semibold text-white leading-snug">{title}</h2>
          <button onClick={onClose} aria-label="Close" className="text-slate-500 hover:text-white p-1 -m-1"><Icon n="x" /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

const Spinner = ({ c = "w-5 h-5" }) => <span className={"inline-block rounded-full border-2 border-slate-600 border-t-cyan-400 animate-spin " + c} />;
const FIELD = "w-full bg-slate-950/70 border border-slate-800 focus:border-cyan-400/60 outline-none rounded-xl pl-10 pr-3 py-2.5 text-slate-100 placeholder-slate-500";

function AuthModal({ onClose, onLogin }) {
  const [mode, setMode] = useState("signin");
  const [f, setF] = useState({ name: "", email: "", pw: "", remember: true });
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState("");
  const up = (k) => (e) => setF({ ...f, [k]: e.target.type === "checkbox" ? e.target.checked : e.target.value });
  const finish = (name, email, kind) => { setBusy(kind); setTimeout(() => onLogin({ name, email }, f.remember), 900); };
  const submit = (e) => {
    e.preventDefault();
    if (busy) return;
    if (mode === "signup" && !f.name.trim()) return setErr("Enter your name to create an account.");
    if (!/^\S+@\S+\.\S+$/.test(f.email)) return setErr("Enter a valid email address.");
    if (f.pw.length < 6) return setErr("Password must be at least 6 characters.");
    setErr("");
    finish(f.name.trim() || f.email.split("@")[0], f.email, "form");
  };
  const social = (p) => !busy && finish(p + " User", p.toLowerCase() + "@demo.satya.ai", p);
  const up_ = mode === "signup";
  return (
    <Modal title={up_ ? "Create your Satya account" : "Sign in to Satya.ai"} onClose={onClose}>
      <div className="grid grid-cols-2 gap-2 mb-4">
        <button type="button" onClick={() => social("Google")} className="flex items-center justify-center gap-2 py-2.5 rounded-xl border border-slate-700 bg-slate-950/60 hover:border-cyan-400/50 text-sm text-slate-200 transition-colors">
          {busy === "Google" ? <Spinner c="w-4 h-4" /> : <b className="text-base bg-gradient-to-br from-sky-400 via-rose-400 to-amber-300 bg-clip-text text-transparent">G</b>}Continue with Google
        </button>
        <button type="button" onClick={() => social("GitHub")} className="flex items-center justify-center gap-2 py-2.5 rounded-xl border border-slate-700 bg-slate-950/60 hover:border-cyan-400/50 text-sm text-slate-200 transition-colors">
          {busy === "GitHub" ? <Spinner c="w-4 h-4" /> : <Icon n="github" s={16} />}Continue with GitHub
        </button>
      </div>
      <div className="flex items-center gap-3 text-xs text-slate-500 mb-4"><span className="h-px flex-1 bg-slate-800" />or use email<span className="h-px flex-1 bg-slate-800" /></div>
      <form onSubmit={submit} className="space-y-3" noValidate>
        {up_ && <div className="relative"><Icon n="user" s={16} c="absolute left-3.5 top-3.5 text-slate-500" /><input aria-label="Full name" value={f.name} onChange={up("name")} placeholder="Full name" className={FIELD} /></div>}
        <div className="relative"><Icon n="mail" s={16} c="absolute left-3.5 top-3.5 text-slate-500" /><input aria-label="Email address" type="email" value={f.email} onChange={up("email")} placeholder="Email address" autoComplete="email" className={FIELD} /></div>
        <div className="relative"><Icon n="lock" s={16} c="absolute left-3.5 top-3.5 text-slate-500" /><input aria-label="Password" type="password" value={f.pw} onChange={up("pw")} placeholder="Password" autoComplete={up_ ? "new-password" : "current-password"} className={FIELD} /></div>
        <div className="flex items-center justify-between text-sm">
          <label className="flex items-center gap-2 text-slate-300 cursor-pointer"><input type="checkbox" checked={f.remember} onChange={up("remember")} className="accent-cyan-400 w-4 h-4" />Remember me</label>
          {!up_ && <button type="button" className="text-cyan-300 hover:underline">Forgot password?</button>}
        </div>
        {err && <p role="alert" className="text-sm text-rose-300 bg-rose-500/10 border border-rose-500/30 rounded-lg px-3 py-2">{err}</p>}
        <button type="submit" disabled={!!busy} className="w-full py-2.5 rounded-xl font-semibold text-slate-950 bg-cyan-400 hover:bg-cyan-300 disabled:opacity-60 shadow-[0_0_24px_rgba(34,211,238,.45)] transition-all flex items-center justify-center gap-2">
          {busy === "form" ? <><Spinner c="w-4 h-4" />{up_ ? "Creating account…" : "Signing in…"}</> : up_ ? "Create Account" : "Sign In"}
        </button>
      </form>
      <p className="text-sm text-slate-400 text-center mt-4">{up_ ? "Already have an account?" : "New to Satya?"} <button type="button" onClick={() => { setMode(up_ ? "signin" : "signup"); setErr(""); }} className="text-cyan-300 font-medium hover:underline">{up_ ? "Sign In" : "Create Account"}</button></p>
      <p className="text-xs text-slate-600 text-center mt-3">Demo only: no credentials leave this page.</p>
    </Modal>
  );
}

const mkQ = () => ({ a: 2 + Math.floor(Math.random() * 8), b: 2 + Math.floor(Math.random() * 8) });

function CaptchaModal({ onClose, onDone }) {
  const [mode, setMode] = useState("box");
  const [st, setSt] = useState("idle");
  const [q, setQ] = useState(mkQ);
  const [ans, setAns] = useState("");
  const [err, setErr] = useState(false);
  const t = useRef();
  useEffect(() => () => clearTimeout(t.current), []);
  const ok = () => { setSt("ok"); t.current = setTimeout(onDone, 1000); };
  const clickBox = () => { if (st !== "idle") return; setSt("loading"); t.current = setTimeout(ok, 1300); };
  const math = (e) => { e.preventDefault(); if (st === "ok") return; if (parseInt(ans, 10) === q.a + q.b) ok(); else { setErr(true); setAns(""); setQ(mkQ()); } };
  return (
    <Modal title="Security Verification — Are You Human?" onClose={onClose}>
      {st === "ok" ? (
        <div className="text-center py-6 rise">
          <span className="mx-auto grid place-items-center w-16 h-16 rounded-full bg-emerald-500/15 border border-emerald-400/50 text-emerald-300 shadow-[0_0_36px_rgba(16,185,129,.5)]"><Icon n="check" s={30} /></span>
          <p className="mt-4 text-emerald-300 font-semibold text-lg">Human Verified</p>
          <p className="text-sm text-slate-400 mt-1">Starting analysis…</p>
        </div>
      ) : (
        <>
          <p className="text-sm text-slate-400 mb-4">Satya checks every request to keep bots from flooding the engine. This takes a few seconds.</p>
          <div role="tablist" className="grid grid-cols-2 gap-1 p-1 rounded-xl bg-slate-950/60 border border-slate-800 mb-4">
            {[["box", "Quick check"], ["math", "Math challenge"]].map(([id, l]) => <button key={id} role="tab" aria-selected={mode === id} disabled={st === "loading"} onClick={() => setMode(id)} className={"py-2 rounded-lg text-sm transition-colors " + (mode === id ? "bg-indigo-500/25 text-cyan-300" : "text-slate-400 hover:text-white")}>{l}</button>)}
          </div>
          {mode === "box" ? (
            <button onClick={clickBox} className="w-full flex items-center gap-4 rounded-xl border border-slate-700 bg-slate-950/70 hover:border-cyan-400/50 px-4 py-4 text-left transition-colors">
              <span className="grid place-items-center w-7 h-7 rounded-md border-2 border-slate-600">{st === "loading" && <Spinner c="w-5 h-5" />}</span>
              <span className="flex-1 text-slate-100">{st === "loading" ? "Verifying…" : "I am human"}</span>
              <span className="text-right text-xs text-slate-500 leading-tight"><Icon n="shield" s={16} c="ml-auto text-cyan-400" />Satya Shield</span>
            </button>
          ) : (
            <form onSubmit={math} className="space-y-3">
              <label className="block text-slate-100">What is <b className="text-cyan-300 text-lg">{q.a} + {q.b}</b> ?
                <input autoFocus inputMode="numeric" value={ans} onChange={(e) => { setAns(e.target.value); setErr(false); }} placeholder="Your answer" className="mt-2 w-full bg-slate-950/70 border border-slate-800 focus:border-cyan-400/60 outline-none rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500" />
              </label>
              {err && <p role="alert" className="text-sm text-rose-300">That wasn’t right. Try this new question.</p>}
              <button type="submit" disabled={!ans.trim()} className="w-full py-2.5 rounded-xl font-semibold text-slate-950 bg-cyan-400 hover:bg-cyan-300 disabled:opacity-40 shadow-[0_0_24px_rgba(34,211,238,.45)] transition-all">Check answer</button>
            </form>
          )}
        </>
      )}
    </Modal>
  );
}

function App() {
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [tab, setTab] = useState("temporal");
  const timer = useRef();
  const [user, setUser] = useState(() => { try { return JSON.parse(localStorage.getItem("satya_user")); } catch (e) { return null; } });
  const [authOpen, setAuthOpen] = useState(false);
  const [pending, setPending] = useState(null);
  const [human, setHuman] = useState(false);
  const login = (u, remember) => { setUser(u); setAuthOpen(false); try { remember ? localStorage.setItem("satya_user", JSON.stringify(u)) : localStorage.removeItem("satya_user"); } catch (e) {} };
  const logout = () => { setUser(null); try { localStorage.removeItem("satya_user"); } catch (e) {} };
  const run = (scn, input, openTab) => {
    clearTimeout(timer.current);
    setLoading(true); setResult(null);
    setTimeout(() => document.getElementById("results-anchor")?.scrollIntoView({ behavior: "smooth", block: "start" }), 50);
    timer.current = setTimeout(() => { setResult({ ...scn, input: input || scn.input }); setTab(openTab || "temporal"); setLoading(false); }, 1500);
  };
  const demo = (id) => { setHuman(false); run(SCENARIOS.find((s) => s.id === id)); };
  const verify = (mode, input) => setPending({ mode, input });
  const doVerify = ({ mode, input }) => {
    setHuman(true);
    const m = String(input).toLowerCase();
    const scn = mode === "audio" ? SCENARIOS[2] : mode === "image" ? SCENARIOS[0] : /bank|rbi|repo|policy|fed/.test(m) ? SCENARIOS[1] : SCENARIOS[0];
    run(scn, input);
  };
  const pick = (id) => {
    const t = id === "audio" ? "audio" : id;
    if (result) { setTab(t); setTimeout(() => document.getElementById("results-anchor")?.scrollIntoView({ behavior: "smooth" }), 50); }
    else run(id === "audio" ? SCENARIOS[2] : SCENARIOS[0], null, t);
  };
  return (
    <div className="min-h-screen">
      <Header user={user} onAuth={() => setAuthOpen(true)} onSignOut={logout} />
      <Hero onVerify={verify} loading={loading} activeId={result?.id} onDemo={demo} />
      <Flow onPick={pick} active={result ? tab : null} />
      <div id="results-anchor" className="px-4 max-w-4xl mx-auto pb-16 scroll-mt-24">
        {loading && <Loading />}
        {result && !loading && <Results r={result} tab={tab} setTab={setTab} human={human} />}
      </div>
      <Extras />
      {authOpen && <AuthModal onClose={() => setAuthOpen(false)} onLogin={login} />}
      {pending && <CaptchaModal onClose={() => setPending(null)} onDone={() => { const p = pending; setPending(null); doVerify(p); }} />}
      <footer className="text-center text-xs text-slate-600 pb-10">Satya.ai · Explainable multimodal verification</footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
